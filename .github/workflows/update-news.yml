name: Update News

on:
  schedule:
    # Zweimal pro Stunde zu ungeraden Minuten. GitHub behandelt Schedules als
    # "best effort" und verwirft Läufe bei hoher Last – zur vollen Stunde ist
    # der Rückstau am größten. Zwei Versuche zu Nebenzeiten ergeben in Summe
    # verlässlich etwa ein Update pro Stunde.
    - cron: "23 * * * *"
    - cron: "53 * * * *"
  workflow_dispatch:
    inputs:
      ai_summary:
        description: "KI-Zusammenfassung erzeugen"
        type: choice
        default: force
        options:
          - force
          - auto
          - skip

permissions:
  contents: write

# Ein verzögerter und ein pünktlicher Lauf dürfen sich nicht überschneiden,
# sonst kollidieren die Pushes.
concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Schreibrecht für den Daten-Commit, Pages-Recht für configure-pages und
      # das Hochladen des Artefakts.
      contents: write
      pages: write
    outputs:
      pushed: ${{ steps.push.outputs.pushed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Fetch news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Die Feeds kommen stündlich, die KI-Zusammenfassung nur zweimal am
          # Tag. Welcher Lauf sie erzeugt, entscheidet das Script anhand der
          # Berliner Ortszeit (07:xx und 19:xx) – Cron kennt nur UTC und läge
          # nach der Zeitumstellung eine Stunde daneben. Manuelle Läufe
          # erzwingen sie standardmäßig.
          AI_SUMMARY_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.ai_summary || 'auto' }}
        working-directory: scripts
        run: python fetch_news.py

      # Ab hier gilt: Schlägt eine Prüfung fehl, bricht der Job ab. Weder Commit
      # noch Push noch Deployment werden erreicht.
      - name: Validate generated JSON
        run: |
          python - <<'PY'
          import json, sys

          required = {"id", "source", "title", "link", "published", "category"}
          problems = []

          for path, key in (("data/news.json", "articles"), ("data/top-news.json", "articles")):
              with open(path, encoding="utf-8") as f:
                  data = json.load(f)
              articles = data.get(key, [])
              if data.get("count") != len(articles):
                  problems.append(f"{path}: count {data.get('count')} != {len(articles)} Artikel")
              ids = [a.get("id") for a in articles]
              if len(set(ids)) != len(ids):
                  problems.append(f"{path}: doppelte IDs")
              for article in articles:
                  missing = required - article.keys()
                  if missing:
                      problems.append(f"{path}: {article.get('id')} fehlt {sorted(missing)}")
                  link = article.get("link", "")
                  if not link.startswith(("http://", "https://")):
                      problems.append(f"{path}: {article.get('id')} hat unsicheren Link {link!r}")
                  image = article.get("image")
                  if image and not image.startswith(("http://", "https://")):
                      problems.append(f"{path}: {article.get('id')} hat unsicheres Bild {image!r}")
                  coverage = article.get("coverage") or {}
                  for other in coverage.get("others", []):
                      other_link = other.get("link", "")
                      if not other_link.startswith(("http://", "https://")):
                          problems.append(
                              f"{path}: {article.get('id')} verweist unsicher auf {other_link!r}"
                          )

          if problems:
              print("\n".join(problems[:20]))
              sys.exit(1)
          print("Daten sind gültig.")
          PY

      - name: Run Python tests
        working-directory: scripts
        run: python -m unittest discover -p "test_*.py" -v

      - name: Run frontend tests
        run: npm test

      - name: Commit and push
        id: push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Update news data"
          # Ein Rebase muss bei parallelen Läufen scheitern: Beide schreiben
          # dieselben JSON-Dateien komplett neu, jede Zeile ist ein Konflikt.
          # Statt zu mergen gewinnen immer die frischen Daten dieses Laufs –
          # sie sind die jüngeren. Dafür werden sie vor der Schleife gesichert
          # und nach einem verlorenen Push auf dem neuesten Remote-Stand als
          # ein einzelner neuer Commit erneut abgelegt.
          fresh="$(mktemp -d)"
          cp -a data/. "$fresh/"
          for attempt in 1 2 3; do
            if git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push-Versuch ${attempt} verloren, hole neuesten Stand ..."
            if [ "$attempt" -eq 3 ]; then
              break
            fi
            sleep 5
            git fetch origin "${GITHUB_REF_NAME}"
            # Der Arbeitsbaum ist durch den Commit oben sauber, der lokale
            # Datencommit steckt im Branch. Das Umsetzen auf den Remote-Stand
            # verwirft genau diesen Commit – nichts Uncommittetes geht
            # verloren, deshalb reicht checkout -B ohne reset --hard/clean.
            git checkout -B "${GITHUB_REF_NAME}" "origin/${GITHUB_REF_NAME}"
            cp -a "$fresh/." data/
            git add data/
            if git diff --cached --quiet; then
              echo "Remote enthält bereits genau diese Daten"
              echo "pushed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -m "Update news data"
          done
          echo "Push nach 3 Versuchen fehlgeschlagen"
          exit 1

      # Pushes mit dem GITHUB_TOKEN lösen keine weiteren Workflows aus. Das
      # Deployment hängt deshalb nicht am Push-Trigger, sondern veröffentlicht
      # genau die Daten, die dieser Lauf erzeugt und gepusht hat.
      - name: Stage static site
        if: steps.push.outputs.pushed == 'true'
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/data
          for asset in \
            index.html \
            styles.css \
            app.js \
            service-worker.js \
            manifest.json \
            favicon.svg \
            favicon-32.png \
            apple-touch-icon.png \
            icon-512.png
          do
            cp "$asset" "_site/$asset"
          done
          # Genau die soeben erzeugten und gepushten Datendateien ausliefern.
          git ls-files -z 'data/*.json' | while IFS= read -r -d '' file; do
            cp "$file" "_site/data/$(basename "$file")"
          done
          echo "Staged files:"
          find _site -type f | sort

      - uses: actions/configure-pages@v5
        if: steps.push.outputs.pushed == 'true'

      - uses: actions/upload-pages-artifact@v4
        if: steps.push.outputs.pushed == 'true'
        with:
          path: _site

  deploy:
    needs: update
    if: needs.update.outputs.pushed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    # Teilt sich die Gruppe mit dem Deploy-Pages-Workflow, damit sich zwei
    # Veröffentlichungen nie überschneiden.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
