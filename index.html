<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News Aggregator</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e3a8a">
</head>
<body>
  <header>
    <h1>📰 News Aggregator</h1>
    <p id="last-updated">Lade Daten …</p>
  </header>

  <nav class="tabs" role="tablist" aria-label="Ansicht">
    <button class="tab active" id="tab-top" data-tab="top" role="tab" aria-selected="true" aria-controls="news-list">🔥 Top News</button>
    <button class="tab" id="tab-latest" data-tab="latest" role="tab" aria-selected="false" aria-controls="news-list">🕐 Neueste</button>
    <button class="tab" id="tab-read" data-tab="read" role="tab" aria-selected="false" aria-controls="news-list">✓ Gelesen</button>
  </nav>

  <main>
    <section id="ai-summary" class="ai-summary hidden">
      <h2>🤖 Zusammenfassung des Tages</h2>
      <div id="ai-summary-content"></div>
    </section>

    <section class="controls">
      <div class="controls-bar">
        <div class="search-wrapper">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="search" id="search" placeholder="Suchen …" autocomplete="off" aria-label="News durchsuchen">
        </div>
        <button class="filter-toggle" id="filter-toggle" aria-expanded="false" aria-controls="filters-panel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M7 12h10"/><path d="M10 18h4"/></svg>
          <span>Filter</span>
          <span class="filter-badge hidden" id="filter-badge">0</span>
        </button>
        <label class="switch" title="Gelesene Artikel ausblenden">
          <input type="checkbox" id="hide-read" checked>
          <span class="switch-slider"></span>
          <span class="switch-label">Gelesene ausblenden</span>
        </label>
        <div class="view-toggle">
          <button class="view-btn active" data-view="grid" title="Kacheln" aria-label="Kachelansicht" aria-pressed="true">⊞</button>
          <button class="view-btn" data-view="list" title="Liste" aria-label="Listenansicht" aria-pressed="false">☰</button>
        </div>
      </div>
      <div class="filters-panel" id="filters-panel">
        <div class="filters-panel-inner">
          <select id="source-filter" aria-label="Quelle filtern">
            <option value="">Alle Quellen</option>
          </select>
          <select id="category-filter" aria-label="Kategorie filtern">
            <option value="">Alle Kategorien</option>
          </select>
        </div>
      </div>
    </section>

    <section id="news-list" class="news-list" role="tabpanel" aria-labelledby="tab-top" tabindex="0">
      <p class="loading">News werden geladen …</p>
    </section>
  </main>

  <footer>
    <p>Daten von tagesschau, heise, golem, spiegel · Aktualisiert etwa stündlich</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
