<!DOCTYPE html>
<html lang="de" data-theme="app">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News Aggregator</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">
  <script>
    // Läuft vor dem ersten Paint, damit Theme und Hell/Dunkel nicht sichtbar
    // umspringen. Die Schlüssel sind absichtlich mit app.js doppelt gepflegt –
    // ein Modul-Import wäre hier ein zusätzlicher Roundtrip.
    (function () {
      try {
        var prefs = JSON.parse(localStorage.getItem("news-aggregator-prefs") || "{}");
        var root = document.documentElement;
        root.dataset.theme = prefs.theme === "editorial" ? "editorial" : "app";
        root.dataset.mode =
          prefs.mode === "dark" || prefs.mode === "light"
            ? prefs.mode
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
      } catch (error) {
        document.documentElement.dataset.mode = "light";
      }
    })();
  </script>
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true">
          <rect class="brand-bg" width="64" height="64" rx="14"/>
          <rect class="brand-headline" x="14" y="18" width="36" height="7" rx="3.5"/>
          <rect class="brand-line" x="14" y="30" width="36" height="5" rx="2.5"/>
          <rect class="brand-line" x="14" y="39" width="22" height="5" rx="2.5"/>
        </svg>
        <h1 class="brand-name">News Aggregator</h1>
      </div>

      <p id="last-updated" class="masthead-meta">Lade Daten …</p>

      <div class="appearance">
        <div class="theme-toggle" role="group" aria-label="Darstellung">
          <button class="theme-btn is-active" data-theme-choice="app" aria-pressed="true">App</button>
          <button class="theme-btn" data-theme-choice="editorial" aria-pressed="false">Zeitung</button>
        </div>
        <button class="mode-toggle" id="mode-toggle" aria-label="Dunkelmodus umschalten" title="Dunkelmodus umschalten">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <nav class="tabbar" role="tablist" aria-label="Ansicht">
    <div class="tabbar-inner">
      <button class="tab active" id="tab-top" data-tab="top" role="tab" aria-selected="true" aria-controls="news-list">Top News</button>
      <button class="tab" id="tab-latest" data-tab="latest" role="tab" aria-selected="false" aria-controls="news-list">Neueste</button>
      <button class="tab" id="tab-read" data-tab="read" role="tab" aria-selected="false" aria-controls="news-list">Gelesen</button>
    </div>
  </nav>

  <main>
    <section id="ai-summary" class="ai-summary hidden">
      <h2 class="ai-summary-title">Zusammenfassung des Tages</h2>
      <div id="ai-summary-content"></div>
    </section>

    <section class="controls">
      <div class="controls-bar">
        <div class="search-wrapper">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="search" id="search" placeholder="Suchen …" autocomplete="off" aria-label="News durchsuchen">
        </div>
        <button class="filter-toggle" id="filter-toggle" aria-expanded="false" aria-controls="filters-panel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M7 12h10"/><path d="M10 18h4"/></svg>
          <span>Filter</span>
          <span class="filter-badge hidden" id="filter-badge">0</span>
        </button>
        <label class="switch" title="Gelesene Artikel ausblenden">
          <input type="checkbox" id="hide-read" checked>
          <span class="switch-slider"></span>
          <span class="switch-label">Gelesene ausblenden</span>
        </label>
        <div class="view-toggle" role="group" aria-label="Layout">
          <button class="view-btn active" data-view="grid" aria-label="Kachelansicht" aria-pressed="true" title="Kacheln">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          </button>
          <button class="view-btn" data-view="list" aria-label="Listenansicht" aria-pressed="false" title="Liste">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
        </div>
      </div>
      <div class="filters-panel" id="filters-panel">
        <div class="filters-panel-inner">
          <select id="source-filter" aria-label="Quelle filtern">
            <option value="">Alle Quellen</option>
          </select>
          <select id="category-filter" aria-label="Kategorie filtern">
            <option value="">Alle Kategorien</option>
          </select>
        </div>
      </div>
    </section>

    <section id="news-list" class="news-list top-view" role="tabpanel" aria-labelledby="tab-top" tabindex="0">
      <div class="skeleton" aria-hidden="true"><div class="skeleton-image"></div><div class="skeleton-body"><span class="skeleton-line w40"></span><span class="skeleton-line w90"></span><span class="skeleton-line w70"></span></div></div>
      <div class="skeleton" aria-hidden="true"><div class="skeleton-image"></div><div class="skeleton-body"><span class="skeleton-line w40"></span><span class="skeleton-line w90"></span><span class="skeleton-line w70"></span></div></div>
      <div class="skeleton" aria-hidden="true"><div class="skeleton-image"></div><div class="skeleton-body"><span class="skeleton-line w40"></span><span class="skeleton-line w90"></span><span class="skeleton-line w70"></span></div></div>
      <div class="skeleton" aria-hidden="true"><div class="skeleton-image"></div><div class="skeleton-body"><span class="skeleton-line w40"></span><span class="skeleton-line w90"></span><span class="skeleton-line w70"></span></div></div>
      <p class="visually-hidden">News werden geladen …</p>
    </section>
  </main>

  <footer>
    <p>Daten von tagesschau, heise, golem und spiegel · Aktualisiert etwa stündlich</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
